name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages serves a project site from /<repo>/, so the base path must
        # match or every asset 404s.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Asks the API to switch Pages on if it is not already. This succeeds
          # only where the Actions token is allowed to create a Pages site; in
          # this repository it is not ("Resource not accessible by integration"),
          # so the FIRST deploy needs a repo admin to set
          # Settings -> Pages -> Source: GitHub Actions by hand. Kept because it
          # is a no-op once Pages is on, and it saves the manual step for anyone
          # forking into an account where the token does have that permission.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
